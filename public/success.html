<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank You!</title>
  <!-- Font Awesome for checkmark icon -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    integrity="sha512-Fo3rlrZj/k7ujTnHq6oXv5Z1FL8N6KT86XnEuE72gN8LG6bKPmTsF+rZ2bBk+vd2kr+Ii8nEGzYahZU7XrZXNw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hero banner -->
  <div class="hero">
    <h1>GreenRent</h1>
  </div>

  <div class="thankyou-container">
    <!-- Header Section -->
    <div class="thankyou-header">
      <div class="checkmark">
        <i class="fas fa-check"></i>
      </div>
      <h1>Thank you for rating us!</h1>
      <p>Your feedback means a lot. Please consider leaving a public review:</p>
    </div>
  
    <!-- Review Links with Logos -->
    <div class="review-links">
      <!-- Google Button -->
      <a
        href="https://www.google.com/maps/place/YourBusiness"
        class="review-btn google"
        target="_blank"
      >
        <img
          src="images/google-logo.png"
          alt="Google"
          class="review-logo"
        />
        Google
      </a>

      <!-- Yandex Button -->
      <a
        href="https://yandex.ru/maps/org/YourBusiness"
        class="review-btn yandex"
        target="_blank"
      >
        <img
          src="images/yandex-logo.png"
          alt="Yandex"
          class="review-logo"
        />
        Yandex
      </a>

      <!-- 2GIS Button -->
      <a
        href="https://2gis.com/YourLocation"
        class="review-btn dgistwo"
        target="_blank"
      >
        <img
          src="images/2gis-logo.png"
          alt=""
          class="review-logo"
        />
        2GIS
      </a>
    </div>
  
    <!-- Example Car Image and Caption -->
    <div class="images-section">
      <img src="images/car.jpg" alt="Car by the coast" />
      <p>We hope you enjoyed our scenic rentals by the sea!</p>
    </div>

    <footer class="footer">
      <p>We appreciate your feedback and hope to serve you again soon!</p>
      <a href="/">Go back to Home</a>
    </footer>
  </div>
</body>
</html>
