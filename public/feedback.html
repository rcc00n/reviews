<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Form with Formspree</title>
  <style>
    /* Basic reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333;
    }

    /* Form container */
    .form-container {
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background-color: #f9fff9;
      border: 1px solid #e0f7e0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,127,0,0.1);
    }

    .form-container h2 {
      color: #007f00;
      margin-bottom: 15px;
      text-align: center;
    }

    .form-container label {
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
      color: #333;
    }

    .form-container input[type="email"],
    .form-container textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .form-container button {
      background-color: #00b300;
      color: #fff;
      font-size: 16px;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }

    .form-container button:hover {
      background-color: #007f00;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Contact Us</h2>
    <form action="https://formspree.io/f/mdkawgno" method="POST"> 
      <label for="email">Your email:</label>
      <input type="email" name="email" id="email" required />

      <label for="message">Your message:</label>
      <textarea name="message" id="message" rows="5" required></textarea>

      <!-- Add other fields as needed -->
      <!-- <input type="text" name="subject" placeholder="Subject" /> -->

      <button type="submit">Send</button>
    </form>
  </div>
</body>
</html>
